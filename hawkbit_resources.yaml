        vault_path: apps/stage/hawkbit
        keys: [password, application-user-credentials.yaml]
      - name: hawkbit-rabbitmq-secret
        managed_by: ExternalSecret/hawkbit-rabbitmq
        vault_path: apps/stage/hawkbit
        keys: [rabbitmq-password, rabbitmq-erlang-cookie]
      - name: hawkbit-gui-secret
        managed_by: ExternalSecret/hawkbit-gui
