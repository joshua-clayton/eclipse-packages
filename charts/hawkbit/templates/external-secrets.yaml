{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- range $name, $s := $es.secrets }}
{{- $s := $s | default dict }}
{{- $key := $s.key | default $es.key }}
{{- $store := merge (deepCopy ($s.secretStoreRef | default dict)) (deepCopy $es.secretStoreRef) }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
{{ include "hawkbit.labels" $ | indent 4 }}
  {{- with merge (deepCopy ($s.annotations | default dict)) (deepCopy ($es.annotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $s.refreshInterval | default $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: {{ $s.targetName | default (printf "%s-secret" $name) }}
    creationPolicy: Owner
    {{- with $s.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $s.data }}
  data:
    {{- range . }}
    {{- $item := deepCopy . }}
    {{- $ref := $item.remoteRef | default dict }}
    {{- if and (not $ref.key) $key }}{{ $_ := set $ref "key" $key }}{{ end }}
    {{- $_ := set $item "remoteRef" $ref }}
    - {{- toYaml $item | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with $s.dataFrom }}
  dataFrom:
    {{- range . }}
    {{- $item := deepCopy . }}
    {{- if hasKey $item "extract" }}
    {{- $ex := $item.extract | default dict }}
    {{- if and (not $ex.key) $key }}{{ $_ := set $ex "key" $key }}{{ end }}
    {{- $_ := set $item "extract" $ex }}
    {{- end }}
    - {{- toYaml $item | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
