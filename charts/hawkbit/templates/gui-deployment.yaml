{{- if .Values.hawkbitgui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hawkbit.fullname" . }}-gui
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
    app.kubernetes.io/component: gui
spec:
  replicas: {{ .Values.hawkbitgui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hawkbit.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hawkbit.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gui
      {{- with .Values.podTemplate.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
    {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
        - name: hawkbitgui
          image: "{{ .Values.hawkbitgui.image.repository }}:{{ .Values.hawkbitgui.image.tag }}"
          imagePullPolicy: {{ .Values.hawkbitgui.image.pullPolicy }}
          env:
            - name: NEXTAUTH_URL
              value: {{ printf "https://%s" .Values.hawkbitgui.hostname | quote }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.hawkbitgui.nextauth.existingSecret }}
                  name: {{ .Values.hawkbitgui.nextauth.existingSecret }}
                  {{- else if .Values.hawkbitgui.nextauth.secret }}
                  name: {{ printf "%s-gui" (include "hawkbit.fullname" .) }}
                  {{- else }}
                  {{- fail "hawkbitgui.nextauth.existingSecret or hawkbitgui.nextauth.secret must be set when hawkbitgui.enabled=true" }}
                  {{- end }}
                  key: NEXTAUTH_SECRET
            - name: HAWKBIT_API_URL
              value: {{ printf "http://%s-%s:8080" (include "hawkbit.fullname" .) (ternary "mgmt" "monolith" .Values.microservices.enabled) | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.hawkbitgui.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
