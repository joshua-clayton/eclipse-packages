{{- if and .Values.ddiProxy.enabled (ne .Values.ddiProxy.mtls.verifyClient "off") .Values.ddiProxy.mtls.clientCa.certificate }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hawkbit.ddiProxy.caConfigMapName" . }}
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
    app.kubernetes.io/component: ddi-proxy
data:
  {{ .Values.ddiProxy.mtls.clientCa.key }}: |
    {{- .Values.ddiProxy.mtls.clientCa.certificate | trim | nindent 4 }}
{{- end }}
