{{- if .Values.job.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- if .Values.job.migrate.skipIfUnchanged }}
  name: {{ include "hawkbit.fullname" . }}-db-migrate-{{ .Chart.AppVersion | lower | replace "+" "-" | trunc 40 | trimSuffix "-" }}
  {{- else }}
  name: {{ include "hawkbit.fullname" . }}-db-migrate
  {{- end }}
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    {{- if .Values.job.migrate.skipIfUnchanged }}
    # Succeeded Jobs are kept so they are not re-run for the same image.tag.
    "helm.sh/hook-delete-policy": hook-failed
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": HookFailed
    {{- else }}
    # Always re-run: the prior Job is deleted first.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded,HookFailed
    {{- end }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hawkbit.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: db-migrate
      {{- with .Values.job.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- with (include "hawkbit.job.serviceAccountName" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      containers:
        - name: db-migrate
          image: "{{ .Values.image.initContainer }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HAWKBIT_DB_MODE
              value: "migrate"
            - name: PROFILES
              value: {{ include "hawkbit.spring.profiles" . | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ include "hawkbit.database.migrateUrl" . | quote }}
            {{- $dbCreds := include "hawkbit.dbCredentialsEnvFor" (dict "root" . "user" .Values.externalDatabase.migrateUser) | trim }}
            {{- if $dbCreds }}
            {{- nindent 12 $dbCreds }}
            {{- end }}
            {{- range (list .Values.extraEnv .Values.job.extraEnv) }}
            {{- $items := include "hawkbit.envList" . | trim }}
            {{- if $items }}
            {{- nindent 12 $items }}
            {{- end }}
            {{- end }}
          envFrom:
            {{- include "hawkbit.dbEnvFrom" . }}
          volumeMounts:
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
      {{- if .Values.extraVolumes }}
      volumes:
        {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
