{{- if .Values.ingress.enabled -}}
{{- $apiVersion := include "hawkbit.ingressAPIVersion" . -}}
{{- $fullName := include "hawkbit.fullname" . -}}
{{- $firstHost := (first .Values.ingress.hosts).host -}}
{{- $domain := join "." (rest (splitList "." $firstHost)) -}}
{{- $guiHost := printf "hawkbitgui.%s" $domain -}}
apiVersion: {{ $apiVersion }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  {{- if eq $apiVersion "networking.k8s.io/v1" }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $.Values.microservices.enabled }}
          {{- /* Microservices: DDI paths explicit, mgmt as catch-all */}}
          {{- range $.Values.microservices.ddi.ingressPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-ddi
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-mgmt
                port:
                  name: http
          {{- else }}
          {{- /* Monolith: route configured paths to the single service */}}
          {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
          {{- end }}
          {{- end }}
  {{- end }}
  {{- /* hawkbitgui gets its own hostname when enabled */}}
  {{- if $.Values.hawkbitgui.enabled }}
    - host: {{ $guiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-gui
                port:
                  name: http
  {{- end }}
{{- end }}
