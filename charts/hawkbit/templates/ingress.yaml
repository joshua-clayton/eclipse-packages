{{- if .Values.ingress.enabled -}}
{{- $apiVersion := include "hawkbit.ingressAPIVersion" . -}}
{{- $fullName := include "hawkbit.fullname" . -}}
{{- $hostname := .Values.ingress.hostname -}}
{{- $guiHost := .Values.hawkbitgui.hostname -}}
apiVersion: {{ $apiVersion }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  {{- if eq $apiVersion "networking.k8s.io/v1" }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ $hostname | quote }}
      http:
        paths:
          {{- if $.Values.microservices.enabled }}
          {{- /* Microservices: DDI controller path routes to DDI service, mgmt is catch-all */}}
          - path: /DEFAULT/controller
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-ddi
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-mgmt
                port:
                  name: http
          {{- else }}
          {{- /* Monolith: single catch-all */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
          {{- end }}
  {{- /* hawkbitgui gets its own hostname when enabled */}}
  {{- if $.Values.hawkbitgui.enabled }}
    - host: {{ $guiHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-gui
                port:
                  name: http
  {{- end }}
{{- end }}
