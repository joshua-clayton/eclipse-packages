{{- if and .Values.ddiProxy.enabled .Values.ddiProxy.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hawkbit.fullname" . }}-ddi-proxy
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
    app.kubernetes.io/component: ddi-proxy
spec:
  minAvailable: {{ .Values.ddiProxy.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "hawkbit.ddiProxy.selectorLabels" . | nindent 6 }}
{{- end }}
