{{- if .Values.microservices.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hawkbit.fullname" . }}-ddi
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
    app.kubernetes.io/component: ddi
spec:
  {{- $hpa := merge (default dict .Values.microservices.ddi.autoscaling) .Values.microservices.autoscaling }}
  {{- if not $hpa.enabled }}
  replicas: {{ .Values.microservices.ddi.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hawkbit.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ddi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hawkbit.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ddi
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podTemplate.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.vaultAgent.enabled }}
        {{- include "hawkbit.vaultAgentAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (include "hawkbit.serviceAccountName" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      initContainers:
        - name: hawkbit-init
          image: "{{ .Values.image.initContainer }}:{{ .Values.microservices.ddi.image.tag }}"
          imagePullPolicy: {{ .Values.microservices.ddi.image.pullPolicy }}
          env:
            {{- include "hawkbit.env" . | nindent 12 }}
          envFrom:
            {{- include "hawkbit.dbEnvFrom" . }}
          volumeMounts:
            - name: configmap
              mountPath: {{ .Values.configMap.mountPath }}
            - name: secret-config
              mountPath: /secret-config
              readOnly: true
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
      containers:
        - name: hawkbit-ddi
          image: "{{ .Values.microservices.ddi.image.repository }}:{{ .Values.microservices.ddi.image.tag }}"
          imagePullPolicy: {{ .Values.microservices.ddi.image.pullPolicy }}
          env:
            {{- $tlsEnv := include "hawkbit.tlsEnv" (dict "tls" .Values.microservices.ddi.tls "metricsPort" .Values.microservices.ddi.metricsPort) }}
            {{- if $tlsEnv }}
            {{- nindent 12 $tlsEnv }}
            {{- end }}
            {{- include "hawkbit.env" . | nindent 12 }}
          envFrom:
            {{- include "hawkbit.dbEnvFrom" . }}
            - secretRef:
                name: {{ include "hawkbit.rabbitmqCredentialsSecretName" . }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            {{- $metricsPort := include "hawkbit.metricsPort" (dict "metricsPort" .Values.microservices.ddi.metricsPort) }}
            {{- if $metricsPort }}
            {{- nindent 12 $metricsPort }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ include "hawkbit.probePort" (dict "metricsPort" .Values.microservices.ddi.metricsPort) }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ include "hawkbit.probePort" (dict "metricsPort" .Values.microservices.ddi.metricsPort) }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          volumeMounts:
            - name: configmap
              mountPath: {{ .Values.configMap.mountPath }}
            {{- if .Values.fileStorage.enabled }}
            - name: storage
              mountPath: {{ .Values.fileStorage.mountPath }}
            {{- end }}
            - name: secret-config
              mountPath: /secret-config
              readOnly: true
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          resources:
{{ toYaml .Values.microservices.ddi.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- if .Values.securityContext.extra }}
        {{- toYaml .Values.securityContext.extra | nindent 8 }}
        {{- end }}
      {{- end }}
      volumes:
        - name: configmap
          configMap:
            name: {{ include "hawkbit.fullname" . }}
      {{- if .Values.fileStorage.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "hawkbit.fullname" . }}-data
      {{- end }}
        - name: secret-config
          projected:
            sources:
              - secret:
                  name: {{ include "hawkbit.userCredentialsSecretName" . }}
                  items:
                    - key: application-user-credentials.yaml
                      path: application-user-credentials.yaml
      {{- if .Values.extraVolumes }}
      {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}
{{- end }}
