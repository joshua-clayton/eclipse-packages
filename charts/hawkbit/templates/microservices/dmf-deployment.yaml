{{- if .Values.microservices.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hawkbit.fullname" . }}-dmf
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
    app.kubernetes.io/component: dmf
spec:
  {{- $hpa := merge (default dict .Values.microservices.dmf.autoscaling) .Values.microservices.autoscaling }}
  {{- if not $hpa.enabled }}
  replicas: {{ .Values.microservices.dmf.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hawkbit.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dmf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hawkbit.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dmf
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podTemplate.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.vaultAgent.enabled }}
        {{- include "hawkbit.vaultAgentAnnotations" . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (include "hawkbit.serviceAccountName" .) }}
      serviceAccountName: {{ . }}
      {{- end }}
      initContainers:
        - name: hawkbit-init
          image: "{{ .Values.image.initContainer }}:{{ .Values.microservices.dmf.image.tag }}"
          imagePullPolicy: {{ .Values.microservices.dmf.image.pullPolicy }}
          env:
            {{- include "hawkbit.env" . | nindent 12 }}
          envFrom:
            {{- include "hawkbit.dbEnvFrom" . | nindent 12 }}
          volumeMounts:
            - name: configmap
              mountPath: {{ .Values.configMap.mountPath }}
            - name: secret-config
              mountPath: /secret-config
              readOnly: true
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
      containers:
        - name: hawkbit-dmf
          image: "{{ .Values.microservices.dmf.image.repository }}:{{ .Values.microservices.dmf.image.tag }}"
          imagePullPolicy: {{ .Values.microservices.dmf.image.pullPolicy }}
          env:
            {{- include "hawkbit.env" . | nindent 12 }}
          envFrom:
            {{- include "hawkbit.dbEnvFrom" . | nindent 12 }}
            - secretRef:
                name: {{ include "hawkbit.rabbitmqCredentialsSecretName" . }}
          volumeMounts:
            - name: configmap
              mountPath: {{ .Values.configMap.mountPath }}
            - name: secret-config
              mountPath: /secret-config
              readOnly: true
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          resources:
{{ toYaml .Values.microservices.dmf.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- if .Values.securityContext.extra }}
        {{- toYaml .Values.securityContext.extra | nindent 8 }}
        {{- end }}
      {{- end }}
      volumes:
        - name: configmap
          configMap:
            name: {{ include "hawkbit.fullname" . }}
        - name: secret-config
          projected:
            sources:
              - secret:
                  name: {{ include "hawkbit.userCredentialsSecretName" . }}
                  items:
                    - key: application-user-credentials.yaml
                      path: application-user-credentials.yaml
      {{- if .Values.extraVolumes }}
      {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}
{{- end }}
