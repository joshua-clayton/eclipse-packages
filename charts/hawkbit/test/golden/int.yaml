# Source: hawkbit/charts/rabbitmq/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hawkbit-int-rabbitmq-config
  namespace: hawkbit
  labels:
    app.kubernetes.io/instance: hawkbit-int
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/version: 4.3.0
    helm.sh/chart: rabbitmq-0.21.3
data:
  rabbitmq.conf: |
    # Default RabbitMQ configuration
    loopback_users.guest = false
    listeners.tcp.default = 5672
    # Management plugin options
    management.tcp.port = 15672
    # Prometheus metrics
    prometheus.tcp.port = 15692

    # Logging configuration
    log.console = true
    log.console.level = info
    log.file = false
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
---
# Source: hawkbit/templates/configmap.yaml
kind: ConfigMap
apiVersion: v1
metadata:
  name: hawkbit-int
  labels:
    app.kubernetes.io/name: hawkbit
    helm.sh/chart: hawkbit-1.7.1-alpha22
    app.kubernetes.io/instance: hawkbit-int
    app.kubernetes.io/version: "0.10.0"
    app.kubernetes.io/managed-by: Helm
data:
  application.yaml: |-
    hawkbit:
      security:
        user:
          admin:
            roles:
            - TENANT_ADMIN
            tenant: DEFAULT
          hawkbit:
            password: '{noop}isAwesome'
            roles: TENANT_ADMIN
            tenant: DEFAULT
      server:
        security:
          dos:
            maxArtifactSize: 10737418240
    server:
      useForwardHeaders: true
    spring:
      cloud:
        stream:
          bindings:
            default:
              group: hawkbit
            device-created:
              destination: device-registry.device-created
            device-deleted:
              destination: device-registry.device-deleted
            device-updated:
              destination: device-registry.device-updated
      config:
        import:
        - optional:file:/secret-config/application-user-credentials.yaml
      rabbitmq:
        host: hawkbit-int-rabbitmq
        listener:
          simple:
            missing-queues-fatal: false
      servlet:
        multipart:
          file-size-threshold: 1MB
          max-file-size: 10GB
          max-request-size: 10GB
