              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
          resources:
            {}
      nodeSelector:
        karpenter.sh/nodepool: infrastructure
      tolerations:
        - effect: NoExecute
          key: cluster-critical
          operator: Equal
          value: "true"
