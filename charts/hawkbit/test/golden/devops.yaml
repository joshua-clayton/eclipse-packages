apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hawkbit-devops-mariadb
  namespace: hawkbit
  labels:
    app.kubernetes.io/instance: hawkbit-devops
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/version: 12.2.2
    helm.sh/chart: mariadb-0.16.1
spec:
  replicas: 1
  serviceName: hawkbit-devops-mariadb
  selector:
    matchLabels:
      app.kubernetes.io/instance: hawkbit-devops
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hawkbit-devops
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/version: 12.2.2
        helm.sh/chart: mariadb-0.16.1
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext: 
        fsGroup: 999
      initContainers:
      containers:
        - name: mariadb
          image: docker.io/mariadb:12.2.2@sha256:e0236fc6386e7eacd9359e59d0a078bd7aa0d18280d36d13061121bedeaee903
          imagePullPolicy: Always
          securityContext: 
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hawkbit-devops-mariadb
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              value: "hawkbit"
            - name: MARIADB_USER
              value: "hawkbit"
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hawkbit-devops-mariadb
                  key: mariadb-password
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hawkbit-devops-mariadb
                  key: metricsExporterPassword
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - healthcheck.sh --connect --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - healthcheck.sh --connect --innodb_initialized
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - mountPath: /tmp
              name: tmp-volume
            - name: exporter-init-scripts
              mountPath: /docker-entrypoint-initdb.d
        - name: metrics
          image: docker.io/prom/mysqld-exporter:v0.18.0@sha256:2598c0571f383708e19016d119bb45c06128a9ebc962c9f49483278ac5a94c41
          imagePullPolicy: Always
          args: 
            - "--mysqld.username=exporter"
            - "--mysqld.address=localhost:3306"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          env: 
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hawkbit-devops-mariadb
                  key: metricsExporterPassword
          ports:
            - name: metrics
              containerPort: 9104
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: exporter-init-scripts
          configMap:
            name: hawkbit-devops-mariadb-init-exporter-user
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          app.kubernetes.io/instance: hawkbit-devops
          app.kubernetes.io/name: mariadb
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "8Gi"
