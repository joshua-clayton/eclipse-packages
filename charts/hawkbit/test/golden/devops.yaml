            - name: ORG_ECLIPSE_HAWKBIT_ARTIFACT_FS_PATH
              value: /var/lib/hawkbit-storage
            - name: HAWKBIT_SECURITY_USER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
