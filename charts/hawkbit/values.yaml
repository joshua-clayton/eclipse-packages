---
# Default values for hawkbit.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: "hawkbit/hawkbit-update-server"
  tag: '0.10.0'
  pullPolicy: IfNotPresent
  initContainer: "hawkbit/hawkbit-repository-jpa-init"

# auth configuration
auth:
  # if set, must contain key: application-user-credentials.yaml
  existingSecret: ""
  username: "admin"
  password: "{noop}admin"
  dmfPassword: "[KEYCLOAK_HAWKBIT_USER_PASSWORD]"
  # gateway token authentication
  gatewayToken:
    enabled: false
    name: ""
    key: ""
    # use an existing secret for key instead; must contain existingSecretKey
    existingSecret: ""
    existingSecretKey: "key"

replicaCount: 1

serviceAccount:
  # Set to false if the ServiceAccount is managed outside this chart.
  create: true
  # Create the ServiceAccounts as ArgoCD PreSync hooks, ahead of the db-migrate Job.
  preSync: false
  name: ""
  annotations: {}
  labels: {}

job:
  podAnnotations: {}
  # ServiceAccount for the db-migrate Job. Defaults to the main ServiceAccount.
  serviceAccountName: ""
  # Extra env vars for the db-migrate Job, added to extraEnv.
  extraEnv:
  migrate:
    # Render the Flyway migrate Job. Set to false to migrate outside the chart.
    enabled: true
    # Keep the Job after it succeeds; it re-runs only when its spec (including
    # image.tag) changes. Failed Jobs are deleted and retried. Set to false to
    # run it on every sync.
    skipIfUnchanged: true

## podDisruptionBudget configuration
podDisruptionBudget:
  enabled: false
  minAvailable: 1

## Pod Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  enabled: true
  # 65534 is the uid of user nobody in the docker image
  fsGroup: 65534
  runAsUser: 65534
  extra: {}

## strategy used to replace old Pods by new ones
## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
updateStrategy:
  ## default is re-create, because of possible database migrations
  type: Recreate

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}
    # traefik.ingress.kubernetes.io/affinity: "true"

livenessProbe:
  initialDelaySeconds: 240
  timeoutSeconds: 5
readinessProbe:
  initialDelaySeconds: 120
  timeoutSeconds: 5

ingress:
  enabled: false
  ingressClassName:
  annotations: {}
    # ingress.kubernetes.io/ssl-redirect: "true"
    # kubernetes.io/tls-acme: "true"
  hostname: hawkbit.local
  tls: []
  #  - secretName: hawkbit-tls
  #    hosts:
  #      - hawkbit.local

routes:
  enabled: false
  tls: true

# enable local file storage
fileStorage:
  enabled: true
  pvcSize: "1Gi"
  mountPath: "/artifactrepo"

# Additional manifests to render (maps or strings, passed through tpl).
extraObjects: []
# - apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: "{{ .Release.Name }}-extra"
#   data:
#     key: value

# ExternalSecret resources (needs External Secrets CRDs). Target Secret
# defaults to <name>-secret.
externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1beta1
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  key: ""
  annotations: {}
  secrets: {}
  # my-secret:
  #   targetName: my-secret
  #   key: path/in/store
  #   secretStoreRef: {name: other-store}
  #   data:
  #     - secretKey: password
  #       remoteRef: {property: password}
  #   dataFrom:
  #     - extract: {}

# optional env vars
extraEnv:
# - name: JAVA_TOOL_OPTIONS
#   value: "-Xms1024m -Xmx1024m"
# A map of name: value is also accepted:
# extraEnv:
#   JAVA_TOOL_OPTIONS: "-Xms1024m -Xmx1024m"
#   SECRET_THING:
#     valueFrom: {secretKeyRef: {name: s, key: k}}

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 500m
  #  memory: 1536Mi
  # requests:
  #  cpu: 100m
  #  memory: 1024Mi

nodeSelector: {}

tolerations: []

affinity: {}

podTemplate:
  annotations: {}

extraVolumes: []
extraVolumeMounts: []

configMap:
  mountPath: "/app/config"

spring:
  profiles: "mysql"

config:
  application:
    server:
      useForwardHeaders: true
    management:
      health:
        probes:
          enabled: true
      endpoint:
        health:
          show-details: when-authorized
      endpoints:
        web:
          exposure:
            include: health
    hawkbit:

## dependency charts config
## External database configuration (used when mariadb.enabled=false).
## type: mariadb (default) or postgresql
externalDatabase:
  type: mariadb
  host: ""
  port: ""
  database: hawkbit
  user: ""
  password: ""  # used when existingSecret is not set
  url: ""  # optional: override the full JDBC URL
  # User and URL for the db-migrate Job. Each falls back to user/url when unset.
  migrateUser: ""
  migrateUrl: ""
  # Query parameters appended to the JDBC URL built from host/port/database
  # (ignored when url is set). migrateUrlParams override urlParams for the
  # db-migrate Job.
  urlParams: {}
  migrateUrlParams: {}
  existingSecret: ""  # must contain keys: SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
  # Set to false to skip mounting the credentials secret as envFrom.
  mountCredentialsSecret: true

## ref: https://github.com/CloudPirates-io/helm-charts/tree/main/charts/mariadb
mariadb:
  enabled: true
  persistence:
    enabled: true
  auth:
    existingSecret: ""
    rootPassword: ""
    database: hawkbit
    username: hawkbit
    password: hawkbit
    secretKeys:
      rootPasswordKey: mariadb-root-password
      userPasswordKey: mariadb-password
  metrics:
    enabled: true

## ref: https://github.com/CloudPirates-io/helm-charts/tree/main/charts/rabbitmq
rabbitmq:
  # hawkbit chart: if set, must contain keys SPRING_RABBITMQ_USERNAME and SPRING_RABBITMQ_PASSWORD;
  # generated from rabbitmq.auth.username and rabbitmq.auth.password if not set
  credentialsSecret: ""
  # external RabbitMQ hostname (used when rabbitmq.enabled=false and microservices.enabled=true)
  host: ""
  enabled: true
  persistence:
    enabled: true
  auth:
    existingSecret: ""
    existingPasswordKey: "rabbitmq-password"
    existingErlangCookieKey: "rabbitmq-erlang-cookie"
    username: hawkbit
    password: hawkbit
    erlangCookie: ""
  metrics:
    enabled: true

## Microservices mode — deploy mgmt, ddi, dmf as separate pods instead of the monolith
microservices:
  enabled: false
  # Default autoscaling config applied to all services unless overridden per-service.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  mgmt:
    image:
      repository: "hawkbit/hawkbit-mgmt-server"
      tag: "0.10.0"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}
  ddi:
    image:
      repository: "hawkbit/hawkbit-ddi-server"
      tag: "0.10.0"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}
  dmf:
    image:
      repository: "hawkbit/hawkbit-dmf-server"
      tag: "0.10.0"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}

## Optional nginx TLS proxy in front of the DDI API. Forwards the verified
## client CN (and an optional issuer hash) as headers.
ddiProxy:
  enabled: false
  image:
    repository: nginx
    tag: 1.27-alpine
    pullPolicy: IfNotPresent
  replicaCount: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  spreadAcrossZones: true
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  tls:
    # Use one: secretName, externalSecret (entry name), or certificate+key.
    secretName: ""
    externalSecret: ""
    certificate: ""
    key: ""
  mtls:
    # on | optional | off
    verifyClient: optional
    clientCa:
      # PEM CA bundle; required if verifyClient is not off, unless configMapName exists.
      certificate: ""
      # ConfigMap name; created from certificate if set, else must exist.
      configMapName: ""
      key: ca.crt
    # Sent as the issuer header for verified clients when set.
    issuerHash: ""
    headers:
      clientCn: X-Ssl-Client-Cn
      issuerHash: X-Ssl-Issuer-Hash-1
  # Accept the PROXY protocol on the TLS port.
  proxyProtocol: false
  maxBodySize: 10g
  timeouts:
    read: 3600s
    send: 3600s
    keepalive: 75s
  service:
    type: ClusterIP
    port: 443
    loadBalancerClass: ""
    annotations: {}

## hawkbitgui — optional Next.js management UI
hawkbitgui:
  enabled: false
  image:
    repository: "ghcr.io/joshua-clayton/hawkbitgui"
    tag: "5b48287"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3000
  hostname: hawkbitgui.local
  nextauth:
    # Use an existing secret containing key: NEXTAUTH_SECRET
    existingSecret: ""
    # Literal value for NEXTAUTH_SECRET; ignored if existingSecret is set
    secret: ""
  resources: {}
